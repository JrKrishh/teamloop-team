[project]
name = "teamloop"
version = "0.4.0"
description = "TeamLoop connector: turns your AI coding session into private, summarized progress for your team."
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
nebius = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
teamloop = "teamloop.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["teamloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
