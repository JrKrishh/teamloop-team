[project]
name = "superagents"
version = "0.3.1"
description = "Super Agents: your team's AI coding agents, on one page. The desktop app with Agent S and the TeamLoop hub."
license = "MIT"
requires-python = ">=3.10"
dependencies = ["teamloop", "fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "pywebview>=5", "mcp>=1.10,<2",
                "playwright>=1.49", "pywinpty>=2; sys_platform == 'win32'", "uiautomation>=2.0.20; sys_platform == 'win32'",
                "cryptography>=42", "segno>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.26"]

[project.scripts]
superagents = "superagents.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["superagents*"]

[tool.setuptools.package-data]
superagents = ["ui/*", "ui/**/*", "skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
