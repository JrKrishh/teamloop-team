name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  connector:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python -m pytest -q
  agent-s:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e agent_s -e connector -e "hub[dev]"
      - run: cd hub && python -m pytest -q
  cloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e agent_s -e hub -e cloud pytest httpx
      - run: cd cloud && python -m pytest -q
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e connector -e "app[dev]"
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: cd app && python -m pytest -q
  exe:
    # Super Agents for Windows: SuperAgents-Setup.exe (SuperAgents.exe + teamloop.exe), then installed, opened twice and
    # uninstalled on this clean machine. On pull requests, on demand (Actions tab) and on a version tag; a branch push
    # skips it, its pull request runs it.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e connector -e agent_s -e hub -e app pyinstaller
      - run: pyinstaller packaging/teamloop.spec --distpath dist --workpath build/pyi --noconfirm
      - run: dist/teamloop/teamloop.exe status
      - run: if (-not (Test-Path dist/teamloop/SuperAgents.exe)) { throw "SuperAgents.exe missing" }
      - name: SuperAgents-Setup.exe (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $v = python -c "import superagents; print(superagents.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DVersion=$v" packaging/SuperAgents.iss
          if ($LASTEXITCODE) { throw "the installer didn't build" }
      - name: Install, open twice, uninstall
        run: python packaging/check_installer.py dist/SuperAgents-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SuperAgents-Setup
          path: dist/SuperAgents-Setup.exe
  apk:
    # Super Agents for Android (native, android/): the crypto test against the laptop's seal, then the shrunk
    # release APK, signed with the debug key until there's a release key; installed by hand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: cd android && chmod +x gradlew && ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk SuperAgents-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SuperAgents-android
          path: SuperAgents-android.apk
