[project]
name = "teamloop-agent-s"
version = "0.4.0"
description = "Agent S: honest, cited task progress from AI coding session events (NVIDIA Nemotron on Nebius Token Factory)."
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_s*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
