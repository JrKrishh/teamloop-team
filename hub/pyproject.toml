[project]
name = "teamloop-hub"
version = "0.1.0"
description = "TeamLoop hub: ccbridge relay + team events, Agent S progress, board and Q&A."
license = "MIT"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5", "teamloop-agent-s"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.26"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
